<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>印刷用マーカー | ARおばけ探偵団</title><style>body{font:16px/1.8 -apple-system,BlinkMacSystemFont,"Yu Gothic UI",sans-serif;color:#14213b;background:#f3f5f8;margin:0}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:28px}a{color:#193a7c}.download{display:inline-block;padding:12px 20px;background:#ffcb59;color:#101c35;font-weight:700;border-radius:9px;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:30px}figure{margin:0;background:#fff;padding:18px;border:1px solid #dce2ea;border-radius:12px}img{width:100%;height:auto}figcaption{font-weight:700}small{color:#586779}button{font:inherit;padding:10px 18px}@media print{.intro{display:none}main{margin:0;padding:0}.cards{display:block;margin:0}figure{width:160mm;padding:0;margin:auto;break-after:page;border:0}figure:last-child{break-after:auto}img{width:160mm;height:160mm}@page{size:A4 portrait;margin:20mm}}</style></head><body><main><div class="intro"><a href="./">← ゲームに戻る</a><h1>マーカーを印刷する</h1><p>ゲームの試作では <strong>H01・H02・H03・ANSWER</strong> の4枚を使います。すでに印刷したカードは、そのまま使えます。カメラで読む画像と同じデータです。</p><a class="download" href="./markers.pdf" target="_blank" rel="noopener">印刷用PDFを開く（A4・9ページ）</a><p>倍率100%・A4縦で印刷します。1枚セットは1ページ目、4枚セットは1・2・3・9ページ目、9枚セットは全ページです。</p><p>白黒でも使用できます。反射の少ない紙に印刷し、PDF内の50mmの目盛りで倍率を確認してください。下の画像を別の画面に表示して試す場合も、最終確認は紙で行ってください。</p></div><div class="cards" id="cards"></div></main><script>const ids=['H01','H02','H03','H04','H05','H06','H07','H08','ANSWER'];document.getElementById('cards').innerHTML=ids.map(id=>'<figure><figcaption>'+id+'</figcaption><a href="./markers/'+id+'.png"><img src="./markers/'+id+'.png" alt="検証用マーカー '+id+'" width="800" height="800"></a><small>calibration-v1</small></figure>').join('');</script></body></html>
