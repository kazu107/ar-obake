<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>印刷用マーカー | ARおばけ探偵団</title>
  <style>
    body{font:16px/1.8 -apple-system,BlinkMacSystemFont,"Yu Gothic UI",sans-serif;color:#14213b;background:#f3f5f8;margin:0}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:28px}a{color:#193a7c}.downloads{display:flex;gap:12px;flex-wrap:wrap}.download{display:inline-block;padding:12px 20px;background:#ffcb59;color:#101c35;font-weight:700;border-radius:9px;text-decoration:none}.download.secondary{background:#fff;border:1px solid #aebbcf}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:30px}figure{margin:0;background:#fff;padding:18px;border:1px solid #dce2ea;border-radius:12px}figure.tutorial{border:3px solid #ffcb59}img{width:100%;height:auto}figcaption{font-weight:700}small{color:#586779}button{font:inherit;padding:10px 18px}@media print{.intro{display:none}main{margin:0;padding:0}.cards{display:block;margin:0}figure{width:160mm;padding:0;margin:auto;break-after:page;border:0}figure:last-child{break-after:auto}img{width:160mm;height:160mm}@page{size:A4 portrait;margin:20mm}}
  </style>
</head>
<body>
<main>
  <div class="intro">
    <a href="./">← ゲームに戻る</a>
    <h1>マーカーを印刷する</h1>
    <p>最初に <strong>TUTORIAL</strong> で練習し、その後H01〜H08・ANSWERを使います。これまでの9枚はそのまま使い、TUTORIALだけ追加で印刷できます。</p>
    <div class="downloads">
      <a class="download" href="./tutorial-marker.pdf" target="_blank" rel="noopener">TUTORIALだけ印刷（A4・1ページ）</a>
      <a class="download secondary" href="./markers.pdf" target="_blank" rel="noopener">全10枚のPDFを開く</a>
    </div>
    <p>倍率100%・A4縦で印刷します。全10枚版はH01〜H08・ANSWER・TUTORIALの順です。4枚の試作は従来どおりH01・H02・H03・ANSWERを使います。</p>
    <p>白黒でも使用できます。反射の少ない紙に印刷し、PDF内の50mmの目盛りで倍率を確認してください。</p>
  </div>
  <div class="cards" id="cards"></div>
</main>
<script>
  const ids=['TUTORIAL','H01','H02','H03','H04','H05','H06','H07','H08','ANSWER'];
  document.getElementById('cards').innerHTML=ids.map(id=>'<figure class="'+(id==='TUTORIAL'?'tutorial':'')+'"><figcaption>'+id+'</figcaption><a href="./markers/'+id+'.png"><img src="./markers/'+id+'.png" alt="印刷用マーカー '+id+'" width="800" height="800"></a><small>tutorial-v1</small></figure>').join('');
</script>
</body>
</html>
