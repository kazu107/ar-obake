<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR camera</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}video,canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;z-index:0}canvas{pointer-events:none;z-index:1}.ar-speech{position:absolute;z-index:3;width:min(72vw,320px);box-sizing:border-box;padding:12px 16px;border:3px solid #101c35;border-radius:18px;background:#fff;color:#101c35;box-shadow:0 7px 18px #101c3540;transform:translate(-50%,-100%);font:700 16px/1.5 -apple-system,BlinkMacSystemFont,"Yu Gothic UI",sans-serif;white-space:pre-line;text-align:left;pointer-events:none}.ar-speech[hidden]{display:none}.ar-speech::after{content:"";position:absolute;left:50%;bottom:-14px;width:20px;height:20px;background:#fff;border-right:3px solid #101c35;border-bottom:3px solid #101c35;transform:translateX(-50%) rotate(45deg)}.ar-speech strong{display:block;margin-bottom:3px;color:#246b5a;font-size:14px}.playback-panel{position:absolute;z-index:5;left:5%;right:5%;top:25%;border-radius:14px;padding:20px;background:#101c35;color:#fff;text-align:center;font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}.playback-panel button{min-height:52px;padding:12px 28px;border:0;border-radius:9px;background:#ffcb59;color:#101c35;font:700 18px sans-serif;touch-action:manipulation}.playback-panel button:disabled{opacity:.6}@media(max-width:520px){.ar-speech{width:min(78vw,280px);padding:10px 13px;font-size:15px}}</style></head><body><script type="module" src="/src/ar/frame.ts"></script></body></html>
